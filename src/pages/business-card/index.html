<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAMAS - Digital Business Card</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#253873" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div id="business-card">
      <h1 class="sr-only">
        Biglietto da visita digitale — YAMAS Taverna Greca
      </h1>
      <div id="card-body">
        <!-- Lato Sinistro: Brand -->
        <header id="card-header">
          <div class="logo-wrapper">
            <img
              src="/assets/logo_top.svg"
              id="logo-top"
              width="200"
              alt="YAMAS Taverna Greca logo"
            />
            <img
              src="/assets/logo_bottom.svg"
              id="logo-bottom"
              width="200"
              alt=""
              aria-hidden="true"
            />
          </div>
        </header>

        <!-- Centro: Informazioni & Interazioni digitali -->
        <main id="card-main">
          <address id="contact-info">
            <p id="contact-tel">
              <i class="icon telephone-fill" aria-hidden="true"></i>
              <a id="link-tel" href="tel:+390813445057">+39 081 344 50 57</a>
            </p>
            <p id="contact-whatsapp">
              <i class="icon whatsapp" aria-hidden="true"></i>
              <a
                id="link-whatsapp"
                href="https://wa.me/390813445057"
                target="_blank"
                rel="noopener noreferrer"
                >Invia un messaggio</a
              >
            </p>
            <p id="contact-address">
              <i class="icon geo-alt-fill" aria-hidden="true"></i>
              <a
                id="link-maps"
                href="https://maps.app.goo.gl/NL7sBq5uoaR92pyh7"
                target="_blank"
                rel="noopener noreferrer"
                >Via Nazionale delle Puglie 69, San Vitaliano (NA)</a
              >
            </p>
          </address>

          <nav id="actions-navigation" aria-label="Azioni rapide">
            <ul id="actions-list">
              <li id="action-save">
                <button id="link-download-vcf" type="button">
                  <i class="icon person-vcard-fill" aria-hidden="true"></i>
                  <span>Aggiungi ai contatti</span>
                </button>
              </li>
              <li id="action-menu">
                <a
                  id="link-menu"
                  href="https://yamastavernagreca.it/menu/"
                  target="_blank"
                  rel="noopener noreferrer"
                  ><i class="icon fork-knife" aria-hidden="true"></i>
                  <span>Sfoglia il Menù</span></a
                >
              </li>
            </ul>
          </nav>
        </main>
      </div>
    </div>

    <script>
      document
        .getElementById("link-download-vcf")
        .addEventListener("click", () => {
          const vcard = [
            "BEGIN:VCARD",
            "VERSION:3.0",
            "N:;YAMAS - Taverna Greca;;;",
            "FN:YAMAS - Taverna Greca",
            "ORG:YAMAS - Taverna Greca",
            "TEL;TYPE=WORK,VOICE:+39 081 344 50 57",
            "ADR;TYPE=WORK:;;Via Nazionale delle Puglie 69;San Vitaliano;NA;80030;Italia",
            "URL:https://yamastavernagreca.it",
            "END:VCARD",
          ].join("\r\n");

          const blob = new Blob([vcard], { type: "text/vcard" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "YAMAS-Taverna-Greca.vcf";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
    </script>
  </body>
</html>
