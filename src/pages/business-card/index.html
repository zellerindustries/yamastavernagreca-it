<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAMAS - Digital Business Card</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#253873" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="YAMAS - Taverna Greca | Biglietto da Visita Digitale" />
    <meta
      property="og:description"
      content="Contatti rapidi, indicazioni e menù di YAMAS Taverna Greca a San Vitaliano."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="__SITE_URL__/assets/twitter-card.webp" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YAMAS - Taverna Greca | Biglietto da Visita Digitale" />
    <meta
      name="twitter:description"
      content="Contatti rapidi, indicazioni e menù di YAMAS Taverna Greca a San Vitaliano."
    />
    <meta name="twitter:image" content="__SITE_URL__/assets/twitter-card.webp" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div id="business-card">
      <h1 class="sr-only">Biglietto da visita digitale — YAMAS Taverna Greca</h1>
      <div id="card-body">
        <!-- Lato Sinistro: Brand -->
        <header id="card-header">
          <div class="logo-wrapper">
            <img
              src="/assets/logo_top.svg"
              id="logo-top"
              width="200"
              height="30"
              alt="YAMAS Taverna Greca logo"
            />
            <img
              src="/assets/logo_bottom.svg"
              id="logo-bottom"
              width="200"
              height="22"
              alt=""
              aria-hidden="true"
            />
          </div>
        </header>

        <!-- Centro: Informazioni & Interazioni digitali -->
        <main id="card-main">
          <address id="contact-info">
            <p id="contact-tel">
              <i class="icon telephone-fill" aria-hidden="true"></i>
              <a id="link-tel" href="tel:+__PHONE_DIGITS__">__PHONE_DISPLAY__</a>
            </p>
            <p id="contact-whatsapp">
              <i class="icon whatsapp" aria-hidden="true"></i>
              <a
                id="link-whatsapp"
                href="https://wa.me/__PHONE_DIGITS__"
                target="_blank"
                rel="noopener noreferrer"
                >Invia un messaggio</a
              >
            </p>
            <p id="contact-address">
              <i class="icon geo-alt-fill" aria-hidden="true"></i>
              <a id="link-maps" href="__MAPS_URL__" target="_blank" rel="noopener noreferrer"
                >__ADDRESS_STREET__, San Vitaliano (NA)</a
              >
            </p>
          </address>

          <nav id="actions-navigation" aria-label="Azioni rapide">
            <ul id="actions-list">
              <li id="action-save">
                <button id="link-download-vcf" type="button">
                  <i class="icon person-vcard-fill" aria-hidden="true"></i>
                  <span>Aggiungi ai contatti</span>
                </button>
              </li>
              <li id="action-menu">
                <a
                  id="link-menu"
                  href="__SITE_URL__/menu/"
                  target="_blank"
                  rel="noopener noreferrer"
                  ><i class="icon fork-knife" aria-hidden="true"></i>
                  <span>Sfoglia il Menù</span></a
                >
              </li>
            </ul>
          </nav>
        </main>
      </div>
    </div>

    <script>
      document.getElementById('link-download-vcf').addEventListener('click', () => {
        const vcard = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          'N:;__SITE_NAME__;;;',
          'FN:__SITE_NAME__',
          'ORG:__SITE_NAME__',
          'TEL;TYPE=WORK,VOICE:__PHONE_DISPLAY__',
          'ADR;TYPE=WORK:;;__ADDRESS_STREET__;San Vitaliano;NA;80030;Italia',
          'URL:__SITE_URL__',
          'END:VCARD',
        ].join('\r\n');

        const blob = new Blob([vcard], { type: 'text/vcard' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'YAMAS-Taverna-Greca.vcf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
