<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAMAS - Digital Business Card</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="
  default-src 'self';
  img-src 'self' data:;
  style-src 'self';
  font-src 'self';
  script-src 'self';
  connect-src 'self';
  base-uri 'self';
  form-action 'none';
  object-src 'none';
"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#253873" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="YAMAS - Taverna Greca | Biglietto da Visita Digitale" />
    <meta
      property="og:description"
      content="Contatti rapidi, indicazioni e menù di YAMAS Taverna Greca a San Vitaliano."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="__SITE_URL__/assets/twitter-card.webp" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YAMAS - Taverna Greca | Biglietto da Visita Digitale" />
    <meta
      name="twitter:description"
      content="Contatti rapidi, indicazioni e menù di YAMAS Taverna Greca a San Vitaliano."
    />
    <meta name="twitter:image" content="__SITE_URL__/assets/twitter-card.webp" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="business-card" id="business-card">
      <h1 class="sr-only">Biglietto da visita digitale — YAMAS Taverna Greca</h1>
      <div class="card-body" id="card-body">
        <!-- Lato Sinistro: Brand -->
        <header class="card-header" id="card-header">
          <div class="logo-wrapper">
            <img
              src="/assets/logo_top.svg"
              class="logo-top"
              id="logo-top"
              width="200"
              height="30"
              alt="YAMAS Taverna Greca logo"
            />
            <img
              src="/assets/logo_bottom.svg"
              class="logo-bottom"
              id="logo-bottom"
              width="200"
              height="22"
              alt=""
              aria-hidden="true"
            />
          </div>
        </header>

        <!-- Centro: Informazioni & Interazioni digitali -->
        <main class="card-main" id="card-main">
          <address class="contact-info" id="contact-info">
            <p id="contact-tel">
              <i class="icon telephone-fill" aria-hidden="true"></i>
              <a id="link-tel" href="tel:+__PHONE_DIGITS__">__PHONE_DISPLAY__</a>
            </p>
            <p id="contact-whatsapp">
              <i class="icon whatsapp" aria-hidden="true"></i>
              <a
                id="link-whatsapp"
                href="https://wa.me/__PHONE_DIGITS__"
                target="_blank"
                rel="noopener noreferrer"
                >Invia un messaggio</a
              >
            </p>
            <p id="contact-address">
              <i class="icon geo-alt-fill" aria-hidden="true"></i>
              <a id="link-maps" href="__MAPS_URL__" target="_blank" rel="noopener noreferrer"
                >__ADDRESS_STREET__, San Vitaliano (NA)</a
              >
            </p>
          </address>

          <nav id="actions-navigation" aria-label="Azioni rapide">
            <ul class="actions-list" id="actions-list">
              <li id="action-save">
                <button class="link-download-vcf" id="link-download-vcf" type="button">
                  <i class="icon person-vcard-fill" aria-hidden="true"></i>
                  <span>Aggiungi ai contatti</span>
                </button>
              </li>
              <li id="action-menu">
                <a
                  class="link-menu"
                  id="link-menu"
                  href="__SITE_URL__/menu/"
                  target="_blank"
                  rel="noopener noreferrer"
                  ><i class="icon fork-knife" aria-hidden="true"></i>
                  <span>Sfoglia il Menù</span></a
                >
              </li>
            </ul>
          </nav>
        </main>
      </div>
    </div>

    <script src="card.js" defer></script>
  </body>
</html>
