<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YAMAS Taverna Greca — Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header role="banner">
    <div aria-label="Restaurant Logo">
      <img id="logo-img" alt="" />
    </div>

    <div class="info-wrapper">
      <h1 id="restaurant-name"></h1>
      <p id="restaurant-description"></p>

      <div class="lang-switcher-group">
        <button type="button" class="lang-btn" data-lang="it">Italiano</button>
        <button type="button" class="lang-btn" data-lang="en">Inglese</button>
      </div>
    </div>
  </header>

  <section aria-labelledby="menu-heading" id="menu-list">
    <!-- category groups injected here -->
  </section>

  <footer role="contentinfo">
    <nav aria-label="Footer Navigation">
      <ul id="footer-links"></ul>
    </nav>

    <address>
      <span id="footer-address"></span><br />
      <a id="footer-phone" href="#"></a>
    </address>

    <p id="footer-copyright"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
