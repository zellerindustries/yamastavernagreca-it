<header role="banner">
  @if(restaurant) {
  <div aria-label="Restaurant Logo">
    <img [src]="sanitizeLogoUrl(restaurant.logoUrl)" [alt]="restaurant.name[restaurantService.lang()] + ' Logo'"
      width="100" height="100" (error)="onLogoError($event)">
  </div>

  <div class="info-wrapper">
    <h1 id="restaurant-name">
      {{ restaurant.name[restaurantService.lang()] }}
    </h1>
    @if(restaurant.description){
    <p id="restaurant-description">
      {{ restaurant.description[restaurantService.lang()] }}
    </p>
    }
    <div>
      <div class="lang-switcher-group">
        <button type="button" class="lang-btn" [class.active]="restaurantService.lang() === 'it'"
          (click)="restaurantService.setLanguage('it')">
          Italiano
        </button>

        <button type="button" class="lang-btn" [class.active]="restaurantService.lang() === 'en'"
          (click)="restaurantService.setLanguage('en')">
          Inglese
        </button>
      </div>
    </div>
  </div>
  }
</header>
