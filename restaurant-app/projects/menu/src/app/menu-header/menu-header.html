<header role="banner">
    @if(restaurant()) {
    <div aria-label="Restaurant Logo">
        <img [src]="sanitizeLogoUrl(restaurant().logoUrl)" [alt]="restaurant().name + ' Logo'" width="100" height="100"
            (error)="onLogoError($event)">
    </div>

    <h1 id="restaurant-name">{{ restaurant().name }}</h1>
