<nav role="navigation" aria-label="Rapid actions" class="bottom-bar">
    @if(rapidActions.length) {
    <ul role="menubar">
        @for(action of rapidActions; track action.name) {
        <li role="none">
            <button type="button" role="menuitem" (click)="performAction(action.type)">
                <span aria-hidden="true">
                    {{ action.type === 'phone' ? '📞' :
                    action.type === 'email' ? '✉️' :
                    action.type === 'directions' ? '🗺️' :
                    '📅' }}
                </span>
                <span class="sr-only">{{ action.name }}</span>
            </button>
        </li>
        } @empty {
        <li>No rapid actions available</li>
        }
    </ul>
    } @else {
    <p>No rapid actions available</p>
    }
</nav>
